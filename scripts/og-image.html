<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --paper: #f7f7f2;
    --ink: #101820;
    --muted: #66706b;
    --navy: #1a2a44;
    --teal-deep: #1c7264;
    --line: rgba(16, 24, 32, 0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--paper);
    font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
    color: var(--ink);
    display: flex;
  }

  /* ── Message ─────────────────────────────────────────────── */
  .copy {
    width: 672px;
    padding: 68px 60px 68px 72px;
    display: flex;
    flex-direction: column;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: auto;
  }

  .brand svg { width: 36px; height: 36px; flex: none; }

  .wordmark {
    position: relative;
    font-size: 29px;
    font-weight: 600;
    letter-spacing: -0.035em;
    color: var(--navy);
    line-height: 1;
  }

  .tittle {
    position: absolute;
    width: 5.2px;
    height: 5.2px;
    border-radius: 999px;
    background: #e86530;
    right: 19.5px;
    top: -3px;
  }

  h1 {
    font-size: 63px;
    font-weight: 500;
    line-height: 1.03;
    letter-spacing: -0.043em;
  }

  .editorial {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    color: var(--teal-deep);
    letter-spacing: -0.005em;
  }

  /* Sub-line sits with the headline, not stranded at the bottom */
  .foot {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    margin-top: 30px;
    margin-bottom: auto;
  }

  .rule {
    width: 40px;
    height: 1px;
    background: rgba(16, 24, 32, 0.3);
    flex: none;
    margin-top: 14px;
  }

  .sub {
    font-size: 21px;
    line-height: 1.5;
    color: var(--muted);
    letter-spacing: -0.012em;
    max-width: 31ch;
  }

  /* ── Façade, bleeding off the right edge ─────────────────── */
  .art {
    position: relative;
    flex: 1;
    overflow: hidden;
    border-left: 1px solid var(--line);
  }

  /* Direct child only — this must not reach the badge icon */
  .art > svg { display: block; width: 100%; height: 100%; }

  .pill {
    position: absolute;
    left: 26px;
    bottom: 26px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 15px 9px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 1px 3px rgba(16, 24, 32, 0.1);
    font-size: 16px;
    font-weight: 500;
    color: var(--teal-deep);
    letter-spacing: -0.008em;
    white-space: nowrap;
  }

  .pill svg { width: 17px; height: 17px; flex: none; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <!-- The mark: open arch, roofline, keystone -->
      <svg viewBox="0 0 100 100" fill="none">
        <defs>
          <linearGradient id="og-arch" x1="6" y1="88" x2="94" y2="14" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#182f4d" />
            <stop offset="48%" stop-color="#1f5a6b" />
            <stop offset="100%" stop-color="#2fa694" />
          </linearGradient>
        </defs>
        <path d="M15 78.3A45 45 0 1 1 85 78.3" stroke="url(#og-arch)" stroke-width="9.6" stroke-linecap="round" />
        <path d="M15 78.3 50 43.6 85 78.3" stroke="url(#og-arch)" stroke-width="9.6" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="50" cy="43.6" r="6.4" fill="#e86530" />
      </svg>
      <span class="wordmark">Haloft<span class="tittle"></span></span>
    </div>

    <h1>
      A better place<br />to find your<br />next <span class="editorial">space</span>.
    </h1>

    <div class="foot">
      <span class="rule"></span>
      <p class="sub">Student housing around your university — priced, placed and checked.</p>
    </div>
  </div>

  <div class="art">
    <!-- A façade study drawn at the panel's own proportions, so nothing
         is cropped and the window grain stays legible in a small preview. -->
    <svg viewBox="0 0 528 630" preserveAspectRatio="xMidYMid slice">
      <rect width="528" height="630" fill="#e7e0d1" />
      <rect width="528" height="64" fill="#edefe9" />
      <rect y="58" width="528" height="14" fill="#1a2a44" opacity="0.9" />
      <rect y="76" width="528" height="2.5" fill="#1a2a44" opacity="0.1" />

      <!-- light falls from the left; the last bay sits in shade -->
      <rect x="472" y="78" width="56" height="552" fill="#1a2a44" opacity="0.05" />

      <g id="courses" fill="#1a2a44" opacity="0.07"></g>
      <g id="windows"></g>

      <rect x="22" y="182" width="484" height="3.5" rx="1.75" fill="#2a9d8f" opacity="0.5" />
      <rect x="22" y="446" width="484" height="3.5" rx="1.75" fill="#2a9d8f" opacity="0.36" />

      <rect y="606" width="528" height="24" fill="#cdc4b0" />
      <rect y="606" width="528" height="1.5" fill="#1a2a44" opacity="0.16" />
    </svg>

    <span class="pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 9.6 4.6 6.1 4.1 5.6 7.6 2.4 9.3 4 12.5 2.4 15.7l3.2 1.7.5 3.5 3.5-.5L12 23l2.4-2.6 3.5.5.5-3.5 3.2-1.7-1.6-3.2 1.6-3.2-3.2-1.7-.5-3.5-3.5.5z"/>
        <path d="m9 12.5 2 2 4-4.5"/>
      </svg>
      Verified listing
    </span>
  </div>

<script>
  // Window grid, drawn so the rhythm is consistent and easy to retune.
  const cols = [36, 116, 196, 276, 356, 436];
  const rows = [104, 192, 280, 368, 456, 544];
  const W = 56, H = 62;
  const LIT = { r: 2, c: 4 };

  const ns = "http://www.w3.org/2000/svg";
  const windows = document.getElementById("windows");
  const courses = document.getElementById("courses");

  const rect = (parent, attrs) => {
    const el = document.createElementNS(ns, "rect");
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    parent.appendChild(el);
  };

  // String courses between floors
  rows.slice(1).forEach((y) =>
    rect(courses, { y: y - 13, width: 528, height: 1.5 })
  );

  rows.forEach((y, r) => {
    cols.forEach((x, c) => {
      const lit = r === LIT.r && c === LIT.c;
      rect(windows, {
        x, y, width: W, height: H, rx: 1.5,
        fill: lit ? "#e5a973" : "#1a2a44",
        opacity: lit ? 0.8 : 0.86,
      });
      // mullion + transom, so each opening reads as joinery
      rect(windows, {
        x: x + W / 2 - 0.75, y, width: 1.5, height: H,
        fill: "#e7e0d1", opacity: 0.5,
      });
      rect(windows, {
        x, y: y + H * 0.36, width: W, height: 1.5,
        fill: "#e7e0d1", opacity: 0.5,
      });
    });
  });
</script>
</body>
</html>
