<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a6e"/>
      <stop offset="100%" stop-color="#3db8a3"/>
    </linearGradient>
  </defs>
  <!-- Arc: open circle, gradient navy → teal -->
  <path
    d="M 38,120 A 62,62 0 1,1 162,120"
    stroke="url(#arcGrad)"
    stroke-width="16"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Chevron / house mark in navy -->
  <path
    d="M 46,116 L 100,62 L 154,116"
    stroke="#1e3a6e"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- Orange accent dot at apex -->
  <circle cx="100" cy="62" r="10" fill="#e86530"/>
</svg>
